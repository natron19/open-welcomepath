# GRADE Goal: a 30-day R.O.O.T.S. onboarding path (Relationships, Orientation, Opportunities,
# Training, Stories) that fits this community and this member. Good = all five roots present
# with 2-4 concrete activities each, spread across weeks 1-4, grounded in the member's background.
# Top concerns: paths that read as a compliance checklist instead of building belonging,
# generic activities that ignore the input, and everything packed into week 1.
template: welcomepath_path_v1

rubric:
  - dimension: useful
    criterion: The path builds belonging (real relationships, early contribution, sharing the member's own story), not just compliance tasks like reading policies and completing forms.
  - dimension: accurate
    criterion: Activities fit the stated community type, member type, and background, and work toward the stated integration goal rather than being generic.
  - dimension: steerable
    criterion: Every activity name is concrete and action-oriented, and each description explains in one to three sentences how to do it.

cases:
  - id: golden_nonprofit_newcomer
    kind: golden
    segment: newcomer
    variables:
      community_type: nonprofit
      member_type: newcomer
      member_background: Recently relocated marketing professional in her late twenties with no prior nonprofit involvement, hoping to meet people in a new city.
      integration_goal: Have at least one strong peer connection and a clear, regular way to help within 30 days.
    checks:
      - { type: json_valid }
      - { type: has_keys, keys: [relationships, orientation, opportunities, training, stories] }
      - { type: count_between, path: relationships, min: 2, max: 4 }
      - { type: count_between, path: orientation, min: 2, max: 4 }
      - { type: count_between, path: opportunities, min: 2, max: 4 }
      - { type: count_between, path: training, min: 2, max: 4 }
      - { type: count_between, path: stories, min: 2, max: 4 }
      - { type: each_has_keys, path: relationships, keys: [name, description, estimated_minutes, week_number] }
      - { type: each_has_keys, path: stories, keys: [name, description, estimated_minutes, week_number] }
      - { type: values_in, path: relationships, field: week_number, allowed: [1, 2, 3, 4] }
      - { type: values_in, path: opportunities, field: week_number, allowed: [1, 2, 3, 4] }
      - { type: matches, pattern: '"week_number"\s*:\s*1\b', dimension: steerable }
      - { type: matches, pattern: '"week_number"\s*:\s*4\b', dimension: steerable }
      - { type: max_chars, path: relationships.0.description, value: 600, dimension: efficient }

